<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>goom.be</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: #0d0d0d;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        height: 100vh;
        user-select: none;
        cursor: default;
    }

    /* ===== شاشة القبضة ===== */
    #screen1 {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        transition: opacity .4s;
    }

    #fist {
        font-size: 40vmin;
        line-height: 1;
        animation: float 2s ease-in-out infinite;
        filter: drop-shadow(0 0 60px rgba(255,255,255,.15));
        cursor: pointer;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50%      { transform: translateY(-20px) scale(1.04); }
    }

    #hint {
        color: #fff;
        font-size: clamp(28px, 6vw, 60px);
        font-weight: 900;
        letter-spacing: 1px;
        animation: blink 1.2s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(255,255,255,.4);
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: .25; }
    }

    #tap-count {
        color: #555;
        font-size: 16px;
        letter-spacing: 4px;
    }

    /* اهتزاز قبل الانتقال */
    #fist.shake { animation: shake .35s ease-in-out 2; }
    @keyframes shake {
        0%,100% { transform: translateX(0) rotate(0); }
        25%     { transform: translateX(-15px) rotate(-8deg); }
        75%     { transform: translateX(15px) rotate(8deg); }
    }

    /* ===== شاشة الرد ===== */
    #screen2 {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .5s;
    }

    #finger {
        font-size: 40vmin;
        line-height: 1;
        cursor: pointer;
        transform: rotate(0deg);
        filter: drop-shadow(0 0 80px rgba(255,60,60,.35));
    }

    /* دوران اليد عند الظهور */
    #screen2.reveal #finger {
        animation: spinIn 1.1s cubic-bezier(.2,.9,.3,1.2) both;
    }
    @keyframes spinIn {
        0%   { transform: rotate(-720deg) scale(.2); opacity: 0; }
        60%  { transform: rotate(20deg) scale(1.15); opacity: 1; }
        100% { transform: rotate(0deg) scale(1); opacity: 1; }
    }

    #message {
        color: #ff3b3b;
        font-size: clamp(34px, 8vw, 80px);
        font-weight: 900;
        text-shadow: 0 0 40px rgba(255,60,60,.6);
        opacity: 0;
        transform: translateY(30px);
        animation: popUp .6s ease-out 1s forwards;
    }
    @keyframes popUp {
        to { opacity: 1; transform: translateY(0); }
    }

    #reset-hint {
        color: #666;
        font-size: 14px;
        letter-spacing: 3px;
        opacity: 0;
        animation: popUp .6s ease-out 1.6s forwards;
    }

    /* خلفية متحركة */
    .glow {
        position: fixed;
        width: 60vmax; height: 60vmax;
        border-radius: 50%;
        filter: blur(120px);
        opacity: .12;
        pointer-events: none;
        background: radial-gradient(circle, #fff, transparent 70%);
        animation: moveGlow 12s ease-in-out infinite alternate;
    }
    @keyframes moveGlow {
        from { transform: translate(-20%, -20%); }
        to   { transform: translate(20%, 20%); }
    }
</style>
</head>
<body>

<div class="glow"></div>

<!-- الشاشة الأولى -->
<div id="screen1">
    <div id="fist">✊🏼</div>
    <div id="hint">اتقر مرتين 👆</div>
    <div id="tap-count"></div>
</div>

<!-- الشاشة الثانية -->
<div id="screen2">
    <div id="finger">🖕🏼</div>
    <div id="message">گووم بي بلاع 🤣</div>
    <div id="reset-hint">اضغط على الإيموجي حتى ترجع</div>
</div>

<script>
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');
    const fist    = document.getElementById('fist');
    const tapCount = document.getElementById('tap-count');

    let clicks = 0, clickTimer = null;

    // دعم الدبل كليك + التاب للجوال
    fist.addEventListener('dblclick', go);
    fist.addEventListener('click', () => {
        clicks++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => {
            if (clicks === 1) tapCount.textContent = 'باقي ضغطة وحدة...';
            clicks = 0;
            setTimeout(() => tapCount.textContent = '', 800);
        }, 250);
        if (clicks >= 2) { clicks = 0; clearTimeout(clickTimer); tapCount.textContent = ''; go(); }
    });

    function go() {
        fist.classList.add('shake');
        setTimeout(() => {
            screen1.style.opacity = '0';
            screen1.style.pointerEvents = 'none';
            screen2.style.opacity = '1';
            screen2.style.pointerEvents = 'auto';
            screen2.classList.add('reveal');
        }, 700);
    }

    // ضغطة وحدة على الرد ترجع للشاشة الأولى
    document.getElementById('finger').addEventListener('click', () => {
        screen2.classList.remove('reveal');
        screen2.style.opacity = '0';
        screen2.style.pointerEvents = 'none';
        screen1.style.opacity = '1';
        screen1.style.pointerEvents = 'auto';
        fist.classList.remove('shake');
        // إعادة تشغيل أنيميشن النص
        const msg = document.getElementById('message');
        msg.style.animation = 'none'; msg.offsetHeight;
        msg.style.animation = '';
    });
</script>

</body>
</html>
